[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alsiyada"
version = "1.0.0"
authors = [{ name = "Farhan Almutairi", email = "far7an.o88@gmail.com" }]
description = "On-prem AI compliance auditor."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }

[project.scripts]
alsiyada = "alsiyada.cli:main"

[tool.setuptools]
packages = ["alsiyada"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
